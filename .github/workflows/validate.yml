name: validate

# Runs on GitHub-hosted runners only. There is deliberately no self-hosted
# runner: this repository is public, and a self-hosted runner would let anyone
# execute code from a fork pull request on the machine that holds the game
# worlds. Deploys stay local -- see docs/DECISIONS.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    name: shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          fail=0
          while IFS= read -r f; do
            echo "── $f"
            shellcheck -S warning "$f" || fail=1
          done < <(find . -name '*.sh' -not -path './.git/*' | sort)
          exit $fail

      - name: no CRLF in shell scripts
        # A single \r makes bash fail with an unreadable "command not found",
        # and these files round-trip through Windows editors constantly.
        run: |
          bad=$(find . -name '*.sh' -not -path './.git/*' -exec grep -lU $'\r' {} + || true)
          if [ -n "$bad" ]; then echo "CRLF found in:"; echo "$bad"; exit 1; fi
          echo "all shell scripts are LF"

  python:
    name: python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.25'

      - name: install locked Minecraft UI test dependencies
        run: uv sync --project minecraft-ui --locked --extra test

      - name: compile
        run: python -m compileall -q eggs tools ui mcp minecraft-ui/app minecraft-ui/tests

      - name: Minecraft UI tests
        working-directory: minecraft-ui
        run: .venv/bin/python -m pytest tests -q

      - name: ruff
        run: uvx --from ruff==0.12.10 ruff check --select E9,F63,F7,F82,F401 eggs tools ui mcp minecraft-ui/app minecraft-ui/tests

  compose:
    name: Minecraft Compose contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: create disposable configuration
        run: |
          umask 077
          mkdir -p stack/secrets
          openssl rand -hex 32 > stack/secrets/minecraft-admin-password-hash
          openssl rand -hex 32 > stack/secrets/minecraft-session-secret
          openssl rand -hex 32 > stack/secrets/schematic-viewer-admin-token
          touch ui/.env

      - name: validate rendered Compose model
        env:
          DB_ROOT_PASSWORD: ci-disposable-root
          DB_PASSWORD: ci-disposable-database
          SCHEMATIC_VIEWER_IMAGE: ghcr.io/scotsgamez/create-schematic-viewer:ci@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        run: docker compose --project-directory stack --file stack/compose.yml config --quiet

  minecraft-integration:
    name: Minecraft UI and real viewer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: lantern-ci-${{ github.run_id }}-${{ github.run_attempt }}
      DB_ROOT_PASSWORD: ci-disposable-root
      DB_PASSWORD: ci-disposable-database
      SCHEMATIC_VIEWER_IMAGE: lantern/schematic-viewer:ci
    steps:
      - name: check out LANtern
        uses: actions/checkout@v4

      - name: check out the reviewed viewer contract
        uses: actions/checkout@v4
        with:
          repository: ScotsGamez/create-schematic-viewer
          ref: ea0f9825d62f77fa26b19d9948d62418b248e6a3
          path: viewer
          ssh-key: ${{ secrets.SCHEMATIC_VIEWER_DEPLOY_KEY }}
          persist-credentials: false

      - name: build both application images
        run: |
          docker build --tag lantern/minecraft-ui:latest minecraft-ui
          docker build --tag "$SCHEMATIC_VIEWER_IMAGE" viewer

      - name: create disposable file secrets
        run: |
          umask 077
          mkdir -p stack/secrets
          openssl rand -hex 32 > stack/secrets/minecraft-session-secret
          openssl rand -hex 32 > stack/secrets/schematic-viewer-admin-token
          openssl rand -base64 36 > "$RUNNER_TEMP/minecraft-admin-password"
          docker run --rm -i lantern/minecraft-ui:latest \
            python -c 'import sys; from argon2 import PasswordHasher; print(PasswordHasher().hash(sys.stdin.read().strip()))' \
            < "$RUNNER_TEMP/minecraft-admin-password" \
            > stack/secrets/minecraft-admin-password-hash
          touch ui/.env

      - name: start only the Minecraft UI and viewer
        run: |
          docker compose --file stack/compose.yml config --quiet
          docker compose --file stack/compose.yml up --detach --no-deps \
            schematic-viewer minecraft-ui

      - name: verify health, proxy, and administrator boundary
        run: |
          set -euo pipefail
          base=http://127.0.0.1:8093

          ready=false
          for _ in $(seq 1 60); do
            if curl --silent --fail --max-time 5 "$base/readyz" > "$RUNNER_TEMP/ready.json"; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            docker compose --file stack/compose.yml ps
            echo 'Minecraft UI did not become ready'
            exit 1
          fi

          curl --silent --fail --max-time 5 "$base/healthz" > "$RUNNER_TEMP/health.json"
          jq --exit-status '.status == "ok"' "$RUNNER_TEMP/health.json"
          jq --exit-status \
            '.status == "ready" and .viewer.application == "create-schematic-viewer" and .viewer.contractVersion == 1' \
            "$RUNNER_TEMP/ready.json"

          redirect_status=$(curl --silent --show-error --max-time 5 \
            --dump-header "$RUNNER_TEMP/redirect.headers" --output /dev/null \
            --write-out '%{http_code}' "$base/schematics")
          test "$redirect_status" = 308
          tr -d '\r' < "$RUNNER_TEMP/redirect.headers" > "$RUNNER_TEMP/redirect.normalized"
          grep --ignore-case --quiet '^location: /schematics/$' "$RUNNER_TEMP/redirect.normalized"

          curl --silent --fail --max-time 5 \
            --header 'X-Lantern-Schematic-Admin: forged-ci-header' \
            --dump-header "$RUNNER_TEMP/anonymous.headers" \
            "$base/schematics/api/v1/capabilities" \
            > "$RUNNER_TEMP/anonymous-capabilities.json"
          jq --exit-status \
            '.application == "create-schematic-viewer" and .contractVersion == 1 and .capabilities.libraryWrite == false' \
            "$RUNNER_TEMP/anonymous-capabilities.json"
          tr -d '\r' < "$RUNNER_TEMP/anonymous.headers" > "$RUNNER_TEMP/anonymous.normalized"
          grep --ignore-case --quiet '^x-content-type-options: nosniff$' "$RUNNER_TEMP/anonymous.normalized"
          if grep --ignore-case --quiet '^set-cookie:' "$RUNNER_TEMP/anonymous.headers"; then
            echo 'viewer Set-Cookie escaped the proxy boundary'
            exit 1
          fi

          jq --null-input --rawfile password "$RUNNER_TEMP/minecraft-admin-password" \
            '{password: ($password | rtrimstr("\n"))}' > "$RUNNER_TEMP/login.json"
          login_status=$(curl --silent --show-error --max-time 5 \
            --header 'Content-Type: application/json' \
            --header 'Origin: http://127.0.0.1:8093' \
            --cookie-jar "$RUNNER_TEMP/admin.cookies" \
            --data-binary "@$RUNNER_TEMP/login.json" \
            --output /dev/null --write-out '%{http_code}' \
            "$base/api/session/login")
          test "$login_status" = 204

          curl --silent --fail --max-time 5 --cookie "$RUNNER_TEMP/admin.cookies" \
            "$base/api/session" > "$RUNNER_TEMP/session.json"
          jq --exit-status '.enabled == true and .authenticated == true' "$RUNNER_TEMP/session.json"

          curl --silent --fail --max-time 5 --cookie "$RUNNER_TEMP/admin.cookies" \
            --header 'X-Lantern-Schematic-Admin: forged-ci-header' \
            "$base/schematics/api/v1/capabilities" \
            > "$RUNNER_TEMP/admin-capabilities.json"
          jq --exit-status '.capabilities.libraryWrite == true' "$RUNNER_TEMP/admin-capabilities.json"
          viewer_token=$(cat stack/secrets/schematic-viewer-admin-token)
          if grep --fixed-strings --quiet "$viewer_token" "$RUNNER_TEMP/admin-capabilities.json"; then
            echo 'private viewer token appeared in a browser response'
            exit 1
          fi

          cross_origin_status=$(curl --silent --show-error --max-time 5 \
            --request POST --header 'Origin: http://attacker.invalid' \
            --data-binary 'synthetic-schematic' --output /dev/null \
            --write-out '%{http_code}' "$base/schematics/api/convert")
          test "$cross_origin_status" = 403

          published=$(docker compose --file stack/compose.yml port schematic-viewer 4173 2>/dev/null || true)
          if [ -n "$published" ]; then
            echo "private viewer unexpectedly published at $published"
            exit 1
          fi
          if curl --silent --fail --max-time 2 http://127.0.0.1:4173/healthz > /dev/null; then
            echo 'private viewer answered directly on the runner host'
            exit 1
          fi
          viewer_container=$(docker compose --file stack/compose.yml ps --quiet schematic-viewer)
          viewer_health=$(docker inspect --format '{{.State.Health.Status}}' "$viewer_container")
          test "$viewer_health" = healthy
          bindings=$(docker inspect --format '{{json .HostConfig.PortBindings}}' "$viewer_container")
          test "$bindings" = null || test "$bindings" = '{}'

      - name: show isolated service logs on failure
        if: failure()
        run: docker compose --file stack/compose.yml logs --no-color --tail 100 minecraft-ui schematic-viewer

      - name: remove the isolated CI stack
        if: always()
        run: docker compose --file stack/compose.yml down --volumes --remove-orphans || true

  eggs:
    name: eggs match their builders
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}

      - name: rebuild and diff
        # The egg JSON is generated. If someone edits it by hand the change is
        # silently lost the next time a builder runs, so treat drift as a failure.
        run: |
          python eggs/build-egg.py
          python eggs/build-mc-egg.py
          if ! git diff --exit-code --stat eggs/; then
            echo
            echo "Egg JSON is out of sync with eggs/src/. Run the builders and commit."
            exit 1
          fi
          echo "eggs are in sync"

      - name: egg schema sanity
        run: |
          python - <<'PY'
          import json, pathlib, sys
          fail = False
          for p in pathlib.Path("eggs").glob("lantern-*.json"):
              e = json.loads(p.read_text(encoding="utf-8"))
              for key in ("name", "uuid", "startup_commands", "config", "scripts", "variables"):
                  if key not in e:
                      print(f"{p.name}: missing {key}"); fail = True
              done = json.loads(e["config"]["startup"]).get("done", "")
              if not done:
                  print(f"{p.name}: empty done-string -- Wings would never mark it running"); fail = True
              if "__" in e["scripts"]["installation"]["script"]:
                  leftover = [w for w in e["scripts"]["installation"]["script"].split() if w.startswith("__") and w.endswith("__")]
                  if leftover:
                      print(f"{p.name}: unreplaced placeholder {leftover}"); fail = True
              print(f"{p.name}: ok ({len(e['variables'])} vars, done={done!r})")
          sys.exit(1 if fail else 0)
          PY

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: no broken relative links
        run: |
          python - <<'PY'
          import pathlib, re, sys
          root = pathlib.Path(".")
          broken = []
          for md in root.rglob("*.md"):
              if ".git" in md.parts:
                  continue
              for text, target in re.findall(r"\[([^\]]+)\]\(([^)]+)\)", md.read_text(encoding="utf-8")):
                  if target.startswith(("http://", "https://", "#", "mailto:")):
                      continue
                  path = (md.parent / target.split("#")[0]).resolve()
                  if not path.exists():
                      broken.append(f"{md}: [{text}]({target})")
          for b in broken:
              print("broken:", b)
          print(f"{len(broken)} broken links")
          sys.exit(1 if broken else 0)
          PY

      - name: no secrets committed
        run: |
          if git ls-files | grep -E '\.env$' | grep -v example; then
            echo "a .env file is tracked"; exit 1
          fi
          tracked_secret_files=$(git ls-files 'stack/secrets/**')
          if [ -n "$tracked_secret_files" ]; then
            echo "a stack/secrets file is tracked:"
            echo "$tracked_secret_files"
            exit 1
          fi
          # Values that must never appear in a public repo.
          # Placeholders are filtered out: docs/SECRETS.md has to show the shape
          # of each value, so the literal variable names appear there by design.
          hits=$(git grep -nIE '(STEAM_PASSWORD|CURSEFORGE_API_KEY|DISCORD_WEBHOOK_URL|MINECRAFT_ADMIN_PASSWORD_HASH|MINECRAFT_SESSION_SECRET|SCHEMATIC_VIEWER_ADMIN_TOKEN)[[:space:]]*=[[:space:]]*["'"'"']?[A-Za-z0-9$./_-]{12,}' -- . \
                 | grep -viE 'your-|change-me|example|placeholder|disposable|getenv|environ|[<{]' || true)
          if [ -n "$hits" ]; then
            echo "a real-looking secret is committed:"; echo "$hits"; exit 1
          fi
          echo "no secrets found"

# LANtern -- Pelican Panel + Wings on Docker CE
#
# Adapted from pelican/panel compose-full-stack.yml and pelican/wings
# docker-compose.example.yml. Changes from upstream are marked LANTERN.
#
# This runs on the `lantern` VM, not on Windows:
#     ssh lantern
#     cd /opt/lantern/stack && docker compose up -d
#
# There used to be a warning here about Git Bash corrupting the socket mount by
# rewriting Linux paths. That hazard went away with WSL: there is no path
# translation layer between this file and the daemon any more.

services:
  database:
    image: mariadb:10.11
    restart: unless-stopped              # LANTERN: was 'always'
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - pelican-db:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set in .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set in .env}
      MYSQL_DATABASE: panel
      MYSQL_USER: pelican
    healthcheck:                          # LANTERN: panel must not race the DB
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12

  cache:
    image: redis:alpine
    restart: unless-stopped              # LANTERN: was 'always'

  panel:
    image: ghcr.io/pelican/panel:latest
    # LANTERN: upstream has 'build: .' for developing the panel. Removed --
    # we consume the published image.
    restart: unless-stopped
    ports:
      - "80:80"                          # LANTERN: plain HTTP, LAN-only. No 443.
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - pelican-data:/pelican-data
      - pelican-logs:/var/www/html/storage/logs
      - type: volume
        source: pelican-data
        target: /var/www/html/plugins
        volume:
          subpath: plugins
    environment:
      APP_URL: ${APP_URL:-http://192.168.0.115}   # LANTERN: LAN IP, reserved on the router
      APP_ENV: production
      APP_DEBUG: "false"
      MAIL_DRIVER: log                   # LANTERN: no SMTP on a LAN
      XDG_DATA_HOME: /pelican-data
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: cache
      DB_CONNECTION: mariadb
      DB_HOST: database
      DB_PORT: "3306"
      DB_DATABASE: panel
      DB_USERNAME: pelican
      DB_PASSWORD: ${DB_PASSWORD:?set in .env}

  wings:
    image: ghcr.io/pelican/wings:latest
    restart: unless-stopped              # LANTERN: was 'always'
    tty: true
    networks:
      - wings0
    ports:
      - "8080:8080"                      # Wings API (panel <-> wings)
      - "2022:2022"                      # SFTP for the panel file manager
    environment:
      TZ: ${TZ:-America/Chicago}
      WINGS_UID: 988
      WINGS_GID: 988
      WINGS_USERNAME: pelican
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "/var/lib/docker/containers/:/var/lib/docker/containers/"
      # These are ordinary paths on the VM's own filesystem. They used to
      # resolve into the Ubuntu WSL filesystem, which is why the note below
      # exists at all -- see
      # docs/DECISIONS.md. Ubuntu's vhdx lives on E:, so game data is on E:.
      - "/etc/pelican/:/etc/pelican/"
      - "/var/lib/pelican/:/var/lib/pelican/"
      - "/var/log/pelican/:/var/log/pelican/"
      - "/tmp/pelican/:/tmp/pelican/"
      - "/etc/ssl/certs:/etc/ssl/certs:ro"

  # CS2 control UI. Hybrid by design: Pelican's client API for power and startup
  # variables, direct RCON for the live roster and moderation (Pelican's command
  # endpoint returns no output, so it cannot answer "who is connected").
  ui:
    build: ../ui
    image: lantern/cs2-ui:latest
    restart: unless-stopped
    environment:
      # The Minecraft UI is bound to the VM's LAN address, not the Docker
      # host-gateway address. Probe the same address the browser opens.
      UI_PROBE_HOST: "${LANTERN_MINECRAFT_UI_BIND_IP:-192.168.0.115}"
    ports:
      - "8090:8090"
    env_file:
      - ../ui/.env
    volumes:
      # Read-only: the UI reads WeaponPaints' bundled item catalogues
      # (skins_en.json etc.) straight from the server's plugin directory, so the
      # skin list always matches the plugin version actually installed.
      - /var/lib/pelican/volumes:/volumes:ro
      # Stardew is a separate compose project, not a Pelican server, so the
      # only way to start and stop it is the Docker API. Without this the
      # Servers page shows Stardew as unavailable rather than failing.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - panel
    extra_hosts:
      # RCON goes to the published game port on the Windows host, not to a
      # container -- the game runs on Wings' own network.
      - "host.docker.internal:host-gateway"

  # Minecraft's product UI is intentionally independent of the game process.
  # It stays reachable when the server is stopped and degrades cleanly if the
  # private schematic sidecar is unavailable.
  minecraft-ui:
    build: ../minecraft-ui
    image: lantern/minecraft-ui:latest
    restart: unless-stopped
    init: true
    ports:
      - "${LANTERN_MINECRAFT_UI_BIND_IP:-192.168.0.115}:8093:8093"
    environment:
      SCHEMATIC_VIEWER_URL: http://schematic-viewer:4173
      MINECRAFT_ADMIN_PASSWORD_HASH_FILE: /run/secrets/minecraft_admin_password_hash
      MINECRAFT_SESSION_SECRET_FILE: /run/secrets/minecraft_session_secret
      SCHEMATIC_VIEWER_ADMIN_TOKEN_FILE: /run/secrets/schematic_viewer_admin_token
      MINECRAFT_SESSION_TTL_SECONDS: "28800"
      MINECRAFT_ALLOW_INSECURE_ADMIN: "false"
      # LANtern is deliberately plain HTTP on the private LAN. Change this to
      # true only after port 8093 is served through HTTPS.
      MINECRAFT_SECURE_COOKIE: "${MINECRAFT_SECURE_COOKIE:-false}"
    secrets:
      - minecraft_admin_password_hash
      - minecraft_session_secret
      - schematic_viewer_admin_token
    group_add:
      # Compose file secrets are bind mounts outside Swarm. Preserve non-root
      # containers by granting only the host secret-file group, never world read.
      - "${LANTERN_SECRET_GID:-1000}"
    networks:
      - minecraft-edge
      - schematic-backplane
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.50
    pids_limit: 128
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8093/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # Create Schematic Viewer is a private implementation detail of minecraft-ui.
  # No host port, Docker socket, game volume, or Wings network is attached.
  schematic-viewer:
    image: "ghcr.io/scotsgamez/create-schematic-viewer:v1.0.1@sha256:d5501af9de95f9b89484ae4e4dbea098b0cdd3e86af3b19e50976855b533444c"
    restart: unless-stopped
    init: true
    expose:
      - "4173"
    environment:
      HOST: 0.0.0.0
      PORT: "4173"
      DATA_DIR: /data
      LIBRARY_WRITE_MODE: trusted-proxy
      LIBRARY_ADMIN_TOKEN_FILE: /run/secrets/schematic_viewer_admin_token
    volumes:
      - schematic-viewer-data:/data
    secrets:
      - schematic_viewer_admin_token
    group_add:
      - "${LANTERN_SECRET_GID:-1000}"
    networks:
      - schematic-backplane
    read_only: true
    tmpfs:
      - /app/.tmp:rw,noexec,nosuid,size=512m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: 2.00
    pids_limit: 256
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4173/readyz').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  pelican-data:
  pelican-logs:
  pelican-db:
  schematic-viewer-data:
    name: lantern-schematic-viewer-data

secrets:
  minecraft_admin_password_hash:
    file: ./secrets/minecraft-admin-password-hash
  minecraft_session_secret:
    file: ./secrets/minecraft-session-secret
  schematic_viewer_admin_token:
    file: ./secrets/schematic-viewer-admin-token

networks:
  default:
    ipam:
      config:
        # LANTERN: upstream uses 172.20.0.0/16, which collides with the
        # existing memory-system_default network on this host. 172.26.x is
        # 172.26.x was taken by the WSL Hyper-V vSwitch on the old host.
        # That is gone, but the subnet stays pinned: changing it would
        # rebuild every container's network for no benefit.
        - subnet: 172.22.0.0/16
  schematic-backplane:
    internal: true
  minecraft-edge:
  wings0:
    name: wings0
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16
    driver_opts:
      com.docker.network.bridge.name: wings0

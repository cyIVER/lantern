# Integration-test override: bind the trusted-LAN administrator flow to runner
# loopback while exercising the same named-session mode used in production.
services:
  minecraft-ui:
    ports: !override
      - "127.0.0.1:8093:8093"
    environment:
      MINECRAFT_ALLOW_INSECURE_ADMIN: "true"
      MINECRAFT_TRUSTED_BROWSER_ORIGINS: "http://127.0.0.1:8093"

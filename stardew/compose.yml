# Stardew Valley dedicated server (JunimoServer) for LANtern.
#
# Adapted from upstream's docker-compose.yml. Four deliberate differences:
#
#   1. No `build:` stanzas. Upstream builds steam-auth and discord-bot from
#      source, which needs the whole repository cloned. Published images exist,
#      so this pulls them instead and LANtern stays a small repo.
#
#      Note the pinned default. sdvd/server publishes a `latest` tag but
#      sdvd/steam-service does NOT -- the only tags both images share are
#      preview builds, which is presumably why upstream builds it from source.
#      A matched pair is pinned rather than tracking the floating `preview`
#      tag, which moves every day.
#   2. Query port moved 27015 -> 27030. CS2 owns 27015 in Pelican.
#   3. API port moved 8080 -> 8091. Wings owns 8080.
#   4. ./mods mounted so SMAPI loads them, and memory capped so this cannot
#      starve the WSL VM the Pelican stack shares.
#   5. A `ui` service, which upstream does not have.
#
# This runs BESIDE Pelican, not inside it. Stardew has no dedicated server
# binary -- JunimoServer runs the real game headless against a virtual display
# with a mod that turns the host farmer into a bot -- so there is nothing for a
# Pelican egg to manage. Use `stack/lantern use stardew`, which knows about it.

name: lantern-stardew

services:
  server:
    image: sdvd/server:${IMAGE_VERSION:-1.5.0-preview.127}
    container_name: sdvd-server
    stdin_open: true
    tty: true
    ports:
      - "${VNC_PORT:-5800}:5800"       # web VNC: watch and drive the game
      - "${API_PORT:-8091}:8080"       # HTTP API
      - "${GAME_PORT:-24642}:24642/udp"
      - "${QUERY_PORT:-27030}:27015/udp"
    cap_add:
      - SYS_TIME                       # clock sync; GOG GalaxyAuth needs it
    volumes:
      - game-data:/data/game
      # The image declares /config as a VOLUME, so without this line Docker
      # invents an anonymous one -- which `compose down -v` and any rebuild
      # discard silently, taking the SMAPI and game configuration with them.
      # `saves` is nested inside it and is mounted after, on purpose: Docker
      # applies mounts shallowest-first, so /config lands before
      # /config/xdg/config/StardewValley and neither shadows the other.
      - config:/config
      - saves:/config/xdg/config/StardewValley
      - ./settings:/data/settings
      - ./diagnostics:/data/diagnostics
      # SMAPI loads anything dropped in here. Content mods (SVE, Ridgeside)
      # must ALSO be installed by every player, at the same version.
      - ./mods:/data/Mods/extra
    environment:
      STEAM_AUTH_URL: "http://steam-auth:${STEAM_AUTH_PORT:-3001}"
      VNC_PASSWORD: "${VNC_PASSWORD:?set VNC_PASSWORD in stardew/.env}"
      ALLOW_INSECURE_SETUP: "${ALLOW_INSECURE_SETUP:-false}"
      # 60 is the maximum and the default. 30 halves CPU for a farm that is
      # mostly idle, and this box has a Minecraft server to think about too.
      SERVER_TPS: "${SERVER_TPS:-30}"
      SDVD_TPS_AGNOSTIC_PACING: "${SDVD_TPS_AGNOSTIC_PACING:-true}"
      # 0 disables rendering entirely. Raise it only while using VNC -- drawing
      # frames nobody watches is pure waste.
      SERVER_FPS: "${SERVER_FPS:-0}"
      SETTINGS_PATH: "/data/settings/server-settings.json"
      API_ENABLED: "${API_ENABLED:-true}"
      API_PORT: "8080"
      API_KEY: "${API_KEY:-}"
      SERVER_PASSWORD: "${SERVER_PASSWORD:-}"
      MAX_LOGIN_ATTEMPTS: "${MAX_LOGIN_ATTEMPTS:-3}"
      AUTH_TIMEOUT_SECONDS: "${AUTH_TIMEOUT_SECONDS:-120}"
    depends_on:
      steam-auth:
        condition: service_healthy
    # A whole Stardew game plus a virtual display. 2 GB is comfortable; the cap
    # exists so a leak cannot take the WSL VM down with it.
    mem_limit: 3g
    cpus: 2.0
    restart: unless-stopped

  steam-auth:
    image: sdvd/steam-service:${IMAGE_VERSION:-1.5.0-preview.127}
    container_name: sdvd-steam-auth
    stdin_open: true
    tty: true
    expose:
      - "${STEAM_AUTH_PORT:-3001}"
    volumes:
      - steam-session:/data/steam-session
      - game-data:/data/game
    environment:
      PORT: "${STEAM_AUTH_PORT:-3001}"
      GAME_DIR: "/data/game"
      SESSION_DIR: "/data/steam-session"
      STEAM_USERNAME: "${STEAM_USERNAME:-}"
      # Prefer STEAM_REFRESH_TOKEN over STEAM_PASSWORD. After the first
      # interactive login, export a token and delete the password:
      #   docker compose run --rm steam-auth export-token
      STEAM_PASSWORD: "${STEAM_PASSWORD:-}"
      STEAM_REFRESH_TOKEN: "${STEAM_REFRESH_TOKEN:-}"
      STEAM_KEEP_LANGUAGES: "${STEAM_KEEP_LANGUAGES:-}"
    mem_limit: 1g
    restart: unless-stopped

  # Optional: live status embed and two-way chat relay in Discord.
  # This needs a BOT token, which is a different thing from the webhook the
  # modpack-update CI posts with. Start it explicitly:
  #   docker compose --profile discord up -d
  discord-bot:
    image: sdvd/discord-bot:${IMAGE_VERSION:-1.5.0-preview.127}
    container_name: sdvd-discord-bot
    profiles: [discord]
    environment:
      DISCORD_BOT_TOKEN: "${DISCORD_BOT_TOKEN:-}"
      API_URL: "http://server:8080"
      UPDATE_INTERVAL_MS: "30000"
      DISCORD_BOT_NICKNAME: "${DISCORD_BOT_NICKNAME:-}"
      DISCORD_CHAT_CHANNEL_ID: "${DISCORD_CHAT_CHANNEL_ID:-}"
      STATUS_DASHBOARD_CHANNEL_ID: "${STATUS_DASHBOARD_CHANNEL_ID:-}"
      STATUS_DASHBOARD_REFRESH_RATE: "${STATUS_DASHBOARD_REFRESH_RATE:-}"
      API_KEY: "${API_KEY:-}"
    depends_on:
      - server
    mem_limit: 256m
    restart: on-failure

  # Control UI. Its own application, not a tab in the CS2 panel -- different
  # game, different audience.
  ui:
    build: ../stardew-ui
    image: lantern/stardew-ui:latest
    container_name: sdvd-ui
    ports:
      - "${UI_PORT:-8092}:8092"
    environment:
      STARDEW_API_URL: "http://server:8080"
      STARDEW_API_KEY: "${API_KEY:-}"
      SDV_CONTAINER: "sdvd-server"
      MODS_DIR: "/mods"
      # The LANtern control service owns the one-server-at-a-time rule, so the
      # power buttons here forward to it rather than reimplementing it. It is a
      # different compose project, so it cannot be reached by service name --
      # host.docker.internal below resolves to the VM, where its port is
      # published.
      LANTERN_UI_URL: "http://host.docker.internal:8090"
    volumes:
      # Read-write: enabling and disabling a mod is a folder rename.
      - ./mods:/mods
      # The Docker socket is here for exactly one reason: SMAPI enumerates mods
      # once at process start, so a toggle cannot take effect without
      # restarting the game container, and nothing else can do that.
      #
      # Be clear-eyed about the trade. Anything that reaches this service can
      # reach the Docker daemon, which is root-equivalent on the host. It is
      # acceptable here because the port is LAN-only on a machine you own; do
      # not forward it. See docs/STARDEW.md.
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Deliberately NOT depends_on: server. This is the UI you use to START the
    # game -- one that only comes up once the game is already running is a UI
    # you cannot use for the thing you most need it for. It handles the server
    # being absent.
    mem_limit: 256m
    restart: unless-stopped

volumes:
  steam-session:
  game-data:
  config:
  saves:

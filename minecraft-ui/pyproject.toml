[project]
name = "lantern-minecraft-ui"
version = "0.1.0"
description = "LANtern Minecraft home and schematic workspace"
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi==25.1.0",
    "fastapi==0.116.1",
    "httpx==0.28.1",
    "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
    "PyYAML==6.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
